<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Tactile Braille Display</title>
  <!-- MQTT.js library from CDN -->
  <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
  <style>
    :root {
      --bg: #fbfbfd;
      --card-bg: #ffffff;
      --card-border: #e2e8f0;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --accent-black: #0f172a;
      --accent-black-hover: #1e293b;
      --dot-inactive: #e2e8f0;
      --dot-inactive-text: #94a3b8;
      --dot-active: #0f172a;
      --dot-active-text: #ffffff;
      --pod-bg: #f1f5f9;
      --success: #16a34a;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px 16px;
    }

    .container {
      width: 100%;
      max-width: 440px;
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    /* Top Header */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 4px 6px;
    }

    header h1 {
      font-size: 1.35rem;
      font-weight: 700;
      letter-spacing: -0.4px;
      color: var(--text-main);
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 0.82rem;
      font-weight: 500;
      color: var(--text-muted);
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #eab308;
      transition: background 0.3s;
    }

    .status-dot.connected {
      background: var(--success);
    }

    .status-dot.disconnected {
      background: #ef4444;
    }

    /* Cards */
    .card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 18px;
      padding: 20px;
      box-shadow: 0 2px 12px rgba(0, 0, 0, 0.04);
    }

    /* Input Card */
    .input-card {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    textarea {
      width: 100%;
      height: 120px;
      background: #ffffff;
      border: 1px solid #cbd5e1;
      border-radius: 12px;
      padding: 14px;
      color: var(--text-main);
      font-size: 1.05rem;
      line-height: 1.5;
      resize: none;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    textarea:focus {
      border-color: var(--accent-black);
      box-shadow: 0 0 0 1px var(--accent-black);
    }

    .btn-send {
      width: 100%;
      background: var(--accent-black);
      color: #ffffff;
      border: none;
      padding: 14px;
      border-radius: 12px;
      font-size: 0.98rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
    }

    .btn-send:hover {
      background: var(--accent-black-hover);
    }

    .btn-send:active {
      transform: scale(0.99);
    }

    .btn-send:disabled {
      background: #94a3b8;
      cursor: not-allowed;
    }

    /* Live Preview Card */
    .preview-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }

    .preview-header {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .preview-title {
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--text-main);
    }

    .char-badge {
      font-size: 0.95rem;
      font-weight: 700;
      color: #ffffff;
      background: var(--accent-black);
      width: 28px;
      height: 28px;
      border-radius: 7px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Centered Braille Cell Pod */
    .braille-pod {
      background: var(--pod-bg);
      border: 1px solid #e2e8f0;
      border-radius: 20px;
      padding: 22px 28px;
      display: grid;
      grid-template-columns: repeat(2, 48px);
      grid-template-rows: repeat(3, 48px);
      gap: 14px 26px;
    }

    .dot {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: var(--dot-inactive);
      color: var(--dot-inactive-text);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.85rem;
      font-weight: 600;
      transition: background 0.2s cubic-bezier(0.4, 0, 0.2, 1), 
                  color 0.2s cubic-bezier(0.4, 0, 0.2, 1),
                  transform 0.2s;
    }

    .dot.active {
      background: var(--dot-active);
      color: var(--dot-active-text);
      transform: scale(1.04);
    }

    /* Full-width Horizontal Timing Bar */
    .timing-container {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 10px;
      align-items: center;
    }

    .timing-bar-track {
      width: 100%;
      height: 5px;
      background: #e2e8f0;
      border-radius: 4px;
      overflow: hidden;
      position: relative;
    }

    .timing-bar-fill {
      height: 100%;
      width: 0%;
      background: var(--accent-black);
      transition: width 0.1s linear;
      border-radius: 4px;
    }

    .status-text {
      font-size: 0.84rem;
      color: var(--text-muted);
      font-weight: 500;
    }

    /* Activity Log Card */
    .log-card {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .log-title {
      font-size: 0.76rem;
      font-weight: 700;
      letter-spacing: 0.6px;
      color: var(--text-muted);
      text-transform: uppercase;
    }

    .console-box {
      background: var(--pod-bg);
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      padding: 12px 14px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 0.78rem;
      color: #334155;
      min-height: 80px;
      max-height: 120px;
      overflow-y: auto;
      display: flex;
      flex-direction: column-reverse;
      gap: 5px;
      line-height: 1.45;
    }

    .console-entry {
      word-break: break-word;
    }
    .console-entry.success { color: #15803d; }
    .console-entry.info { color: #0f172a; }
  </style>
</head>
<body>
  <div class="container">
    <!-- Header -->
    <header>
      <h1>Tactile Braille Display</h1>
      <div class="status-badge">
        <div id="statusDot" class="status-dot"></div>
        <span id="statusText">Connecting</span>
      </div>
    </header>

    <!-- Text Input Card -->
    <div class="card input-card">
      <textarea id="messageInput" placeholder="Enter text..." maxlength="200">iam iron man</textarea>
      <button id="sendBtn" class="btn-send" onclick="sendMessage()">Send</button>
    </div>

    <!-- Live 2x3 Braille Cell Preview -->
    <div class="card preview-card">
      <div class="preview-header">
        <span class="preview-title">Live 2×3 Braille Cell Preview:</span>
        <div id="charBadge" class="char-badge">✓</div>
      </div>

      <!-- Centered 2x3 Pod (Left: 1, 2, 3; Right: 4, 5, 6) -->
      <div class="braille-pod">
        <div id="dot1" class="dot">1</div>
        <div id="dot4" class="dot">4</div>
        <div id="dot2" class="dot">2</div>
        <div id="dot5" class="dot">5</div>
        <div id="dot3" class="dot">3</div>
        <div id="dot6" class="dot">6</div>
      </div>

      <!-- Long Full-width Horizontal Timing Bar & Status -->
      <div class="timing-container">
        <div class="timing-bar-track">
          <div id="timingFill" class="timing-bar-fill"></div>
        </div>
        <span id="timingStatus" class="status-text">Sequence Complete!</span>
      </div>
    </div>

    <!-- Activity Log Card -->
    <div class="card log-card">
      <div class="log-title">ACTIVITY LOG</div>
      <div id="consoleBox" class="console-box"></div>
    </div>
  </div>

  <script>
    // Standard Grade 1 Braille Matrix (Dots 1 to 6)
    const BRAILLE_MAP = {
      'a': [1, 0, 0, 0, 0, 0],
      'b': [1, 1, 0, 0, 0, 0],
      'c': [1, 0, 0, 1, 0, 0],
      'd': [1, 0, 0, 1, 1, 0],
      'e': [1, 0, 0, 0, 1, 0],
      'f': [1, 1, 0, 1, 0, 0],
      'g': [1, 1, 0, 1, 1, 0],
      'h': [1, 1, 0, 0, 1, 0],
      'i': [0, 1, 0, 1, 0, 0],
      'j': [0, 1, 0, 1, 1, 0],
      'k': [1, 0, 1, 0, 0, 0],
      'l': [1, 1, 1, 0, 0, 0],
      'm': [1, 0, 1, 1, 0, 0],
      'n': [1, 0, 1, 1, 1, 0],
      'o': [1, 0, 1, 0, 1, 0],
      'p': [1, 1, 1, 1, 0, 0],
      'q': [1, 1, 1, 1, 1, 0],
      'r': [1, 1, 1, 0, 1, 0],
      's': [0, 1, 1, 1, 0, 0],
      't': [0, 1, 1, 1, 1, 0],
      'u': [1, 0, 1, 0, 0, 1],
      'v': [1, 1, 1, 0, 0, 1],
      'w': [0, 1, 0, 1, 1, 1],
      'x': [1, 0, 1, 1, 0, 1],
      'y': [1, 0, 1, 1, 1, 1],
      'z': [1, 0, 1, 0, 1, 1],
      ' ': [0, 0, 0, 0, 0, 0]
    };

    const BROKER_URL = "wss://broker.emqx.io:8084/mqtt";
    const TOPIC = "braille/display/input";
    const CLIENT_ID = "BrailleWeb_" + Math.random().toString(16).substring(2, 9);

    let client = null;
    let isConnected = false;
    let playbackTimer = null;

    const statusDot = document.getElementById("statusDot");
    const statusText = document.getElementById("statusText");
    const messageInput = document.getElementById("messageInput");
    const sendBtn = document.getElementById("sendBtn");
    const charBadge = document.getElementById("charBadge");
    const timingFill = document.getElementById("timingFill");
    const timingStatus = document.getElementById("timingStatus");
    const consoleBox = document.getElementById("consoleBox");

    function log(msg, type = "normal") {
      const entry = document.createElement("div");
      entry.className = "console-entry " + type;
      const time = new Date().toLocaleTimeString();
      entry.innerText = `[${time}] ${msg}`;
      consoleBox.prepend(entry);
    }

    function connectMQTT() {
      log("Connecting to EMQX Broker...", "info");
      client = mqtt.connect(BROKER_URL, {
        clientId: CLIENT_ID,
        clean: true,
        connectTimeout: 5000,
        reconnectPeriod: 3000
      });

      client.on("connect", () => {
        isConnected = true;
        statusDot.className = "status-dot connected";
        statusText.innerText = "Ready";
        sendBtn.disabled = false;
        log("Connected to MQTT Broker (Ready)", "success");
      });

      client.on("offline", () => {
        isConnected = false;
        statusDot.className = "status-dot disconnected";
        statusText.innerText = "Offline";
        sendBtn.disabled = true;
        log("Disconnected from broker.", "info");
      });

      client.on("error", (err) => {
        log("MQTT Error: " + err.message, "info");
      });
    }

    function renderDots(dots) {
      for (let i = 1; i <= 6; i++) {
        const dotElem = document.getElementById("dot" + i);
        if (dots[i - 1] === 1) {
          dotElem.classList.add("active");
        } else {
          dotElem.classList.remove("active");
        }
      }
    }

    function sendMessage() {
      const text = messageInput.value.trim();
      if (!text) return;

      if (!isConnected || !client) {
        alert("MQTT is connecting. Please wait...");
        return;
      }

      client.publish(TOPIC, text, { qos: 0 }, (err) => {
        if (!err) {
          log(`Published: "${text}"`, "success");
          startSmartPlayback(text);
        } else {
          log("Publish failed: " + err.message, "info");
        }
      });
    }

    // Smart Delta Playback matching TinyML decision making
    function startSmartPlayback(text) {
      if (playbackTimer) clearTimeout(playbackTimer);
      const chars = text.toLowerCase().split("");
      let index = 0;
      let prevPattern = [0, 0, 0, 0, 0, 0];

      function step() {
        if (index >= chars.length) {
          renderDots([0, 0, 0, 0, 0, 0]);
          charBadge.innerText = "✓";
          timingStatus.innerText = "Sequence Complete!";
          timingFill.style.width = "100%";
          return;
        }

        const c = chars[index];
        const nextPattern = BRAILLE_MAP[c] || [0, 0, 0, 0, 0, 0];

        // TinyML Delta Decision: Identify which dots change
        const isDuplicate = (index > 0 && chars[index] === chars[index - 1]);

        charBadge.innerText = (c === ' ') ? '␣' : c.toUpperCase();
        timingStatus.innerText = `Displaying '${c.toUpperCase()}' (${index + 1}/${chars.length})`;

        // Trigger visual timing bar
        timingFill.style.transition = "none";
        timingFill.style.width = "0%";
        setTimeout(() => {
          timingFill.style.transition = "width 500ms linear";
          timingFill.style.width = "100%";
        }, 20);

        if (isDuplicate) {
          // Quick dip / pulse for identical consecutive characters
          renderDots([0, 0, 0, 0, 0, 0]);
          setTimeout(() => {
            renderDots(nextPattern);
          }, 80);
        } else {
          // Smart delta update: only state changes actuate
          renderDots(nextPattern);
        }

        prevPattern = nextPattern;
        index++;
        playbackTimer = setTimeout(step, 550);
      }

      step();
    }

    window.addEventListener("DOMContentLoaded", () => {
      connectMQTT();
    });
  </script>
</body>
</html>
